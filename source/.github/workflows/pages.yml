name: Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Build for the project subpath
        run: npm run build
        env:
          VITE_BASE: /xiaoyoumingqi-web/
      - name: Keep the Pages artifact to compiled files
        run: |
          set -eu
          rm -f dist/rule-config.json
          find dist -name '*.map' -delete
          test ! -e dist/rule-config.json
          test ! -e dist/src
          test ! -e dist/tests
          test ! -e dist/reports
          if find dist -name '*.map' | grep -q .; then
            echo "sourcemap leaked into dist"
            exit 1
          fi
          test -f dist/index.html
          grep -q '/xiaoyoumingqi-web/assets/' dist/index.html

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
        env:
          VITE_BASE: ${{ steps.pages.outputs.base_path }}/
      - name: Keep the Pages artifact to compiled files
        run: |
          set -eu
          rm -f dist/rule-config.json
          find dist -name '*.map' -delete
          test ! -e dist/rule-config.json
          test ! -e dist/src
          test ! -e dist/tests
          test ! -e dist/reports
          if find dist -name '*.map' | grep -q .; then
            echo "sourcemap leaked into dist"
            exit 1
          fi
          test -f dist/index.html
          grep -q "${{ steps.pages.outputs.base_path }}/assets/" dist/index.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
